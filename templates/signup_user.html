<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Glassmorphism login Form Tutorial in html css</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!--Stylesheet-->
    <style media="screen">
      *,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body{
    background-image:url("/static/images/bg_img.avif");
    height: 100vh;
    background-size: cover;
    background-position: center;
    
    background-repeat: no-repeat;
}
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
{% comment %} .background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
}
.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px; {% endcomment %}
{% comment %} } {% endcomment %}
form{
    height: 520px;
    width: 650px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%,-50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 14px 35px;
}

form *{
    font-family: 'Poppins',sans-serif;
    color: white;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
    
}
form h3{
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label{
    display: block;
    margin-top: 30px;
    font-size: 16px;
    font-weight: 500;
}
input{
    display: block;
    height: 50px;
    width: 100%;
    background-color: black;
    border-radius: 3px;
    padding: 0 10px;
    margin-top:  3px;
    font-size: 14px;
    font-weight: 300;

}
::placeholder{
    color: #e5e5e5;
}
button{
    margin-top: 30px;
    width: 100%;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    background-color: black;
    color: white;
}
.social{
  margin-top: 30px;
  display: flex;
}
.social div{
  background: red;
  width: 150px;
  border-radius: 3px;
  padding: 5px 10px 10px 5px;
  background-color: rgba(255,255,255,0.27);
  color: #eaf0fb;
  text-align: center;
}
.social div:hover{
  background-color: rgba(255,255,255,0.47);
}
.social .fb{
  margin-left: 25px;
}
.social i{
  margin-right: 4px;
}
.select{
     display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
}
.links{
    display: flex;
    align-items: center;
    justify-content: space-around;
    margin-top: 15px;
}
.input_container{
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.input_feild{
    display: flex;
    flex-direction: column;
    width: 47%;
}
#role{ 
    height: 46px;
    background-color: black;
    margin-top: 3px;
    border-radius: 3px;
}
.option{
   background-color: black;
}
    </style>
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form method="POST" onsubmit="signupuserbtn(event)">
         {% csrf_token %}
         <h3>Register As User</h3>
         {% if error.cnf_password %}
           <p>{{error.cnf_password.0}}</p>
         {% endif %} 
         <p id="error_msg"></p>
        <div class="input_container">
        <div class="input_feild">
        <label for="username">UserName</label>
        <input type="text" placeholder="Username" id="username" name="username" required>
        </div>
        <div class="input_feild">
        <label for="Email">Email</label>
        <input type="email" placeholder="Email" id="Email" name="Email" required>
        </div>
        </div>
        <div class="input_container">
        <div class="input_feild">
        <label for="role">Select Role:</label>
        <select name="role" id="role" required>
            <option class="option" value="manager">Manager</option>
            <option  class="option" value="supervisor">Supervisor</option>
        </select>
    </div>
    <div class="input_feild">
        <label for="password">Password</label>
        <input type="password" placeholder="Password" id="password" name="password" required>
    </div>
    </div>
  
        <label for="cnf_password">confirm Password</label>
        <input type="password" placeholder="Password" id="cnf_password" name="cnf_password" required>
        
        <button type="submit">Register</button>
        <div class="links">
        <a href="{% url 'login' %}">login as User</a>
        <a href="{% url 'consumer_signup' %}">Register As Consumer</a>
        </div>
    </form>
    <script>
        async function signupuserbtn(event){
            event.preventDefault();
            const username=document.getElementById("username").value;
            const Email =document.getElementById("Email").value;
            const role =document.getElementById("role").value;
            const password = document.getElementById("password").value;
            const cnf_password = document.getElementById("cnf_password").value;
            const error_msg=document.getElementById("error_msg");


            const csrfToken = document.querySelector(
            '[name="csrfmiddlewaretoken"]'
             ).value;
            
            try {
                const response = await fetch('', {
                method: "POST",  // Required to send signup data

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },

                body: JSON.stringify({
                    username: username,
                    Email: Email,
                    role: role,
                    password: password,
                    cnf_password: cnf_password
                })
            });

                const data = await response.json();

                console.log(data);

                if (response.ok) {
                    window.location.href = data.pageurl;
                } else {
                    console.log("response is not ok");
                }
            }

            catch (error) {
               console.log("try block have error")
               console.error("Error:", error);
            }

        }

    </script>

</body>
</html>
