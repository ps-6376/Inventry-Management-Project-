<!DOCTYPE html>
<html lang="en">
<head>

    <style media="screen">
      *,
*:before,
*:after{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
body{
    background-image:url("/static/images/login_bg.jpg");
    height: 100vh;
    background-size: cover;
    background-position: center;
}
.background{
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
{% comment %} .background .shape{
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
}
.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px;
} {% endcomment %}
form{
    height: 520px;
    width: 400px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%,-50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 20px 35px;
}
form *{
    font-family: 'Poppins',sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
}
form h3{
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label{
    display: block;
    font-size: 16px;
    font-weight: 500;
    margin-top: 25px;
}
input{
    display: block;
    height: 50px;
    width: 100%;
    background-color: black;
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
}
::placeholder{
    color: #e5e5e5;
}
button{
    margin-top: 30px;
    width: 100%;
    background-color: #ffffff;
    color: #080710;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
}
.social{
  margin-top: 30px;
  display: flex;
}
.social div{
  background: red;
  width: 150px;
  border-radius: 3px;
  padding: 5px 10px 10px 5px;
  background-color: rgba(255,255,255,0.27);
  color: #eaf0fb;
  text-align: center;
}
.social div:hover{
  background-color: rgba(255,255,255,0.47);
}
.social .fb{
  margin-left: 25px;
}
.social i{
  margin-right: 4px;
}
#role{
   width: 100%;
    margin-top: 8px;
    height: 50px;
    background-color: black;
}

    </style>
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form method="POST" onsubmit="loginbutton(event)">
        {% csrf_token %}
        <h3>Login Here</h3>
        <p id="errormsg"></p>

        <label for="Email">Email</label>
        <input type="email" placeholder="Email" id="Email" name="Email">

        <label for="password">Password</label>
        <input type="password" placeholder="Password" id="password" name="password">

        <button type="submit">Log In</button>
    </form>
   ```html
<script>
    async function loginbutton(event) {

        // Prevent normal form submission
        event.preventDefault();

        // Get input values
        const Email = document.getElementById("Email").value;
        const password = document.getElementById("password").value;
        const errormsg = document.getElementById("errormsg");

        // Get CSRF token from Django template
        const csrfToken = document.querySelector(
            '[name="csrfmiddlewaretoken"]'
        ).value;

        try {
            const response = await fetch("/login/", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },

                body: JSON.stringify({
                    Email: Email,
                    password: password,
                })
            });

            const data = await response.json();

            console.log(data);

            if (response.ok) {

                console.log("Login successful");
                const pageurl=data.pageurl;
                window.location.href= pageurl;
                }
                else{
                    console.log("username and pageurl not found")
                }


                // Example: redirect after successful login
                // window.location.href = data.redirect_url;
            } else {
                errormsg.textContent =
                    data.error || "Login failed. Please try again.";

                console.log("Login failed");
            }

        } 
        catch (error) {
            errormsg.textContent =
                "Something went wrong. Please try again.";

            console.error("Error:", error);
        }
    }
</script>
       
</body>
</html>
